apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-mon-game
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      hostname: mymon-game.test
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: mymon-game-tls
      allowedRoutes:
        namespaces:
          from: All
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: my-mon-game
spec:
  parentRefs:
    - name: my-mon-game
      namespace: default
      sectionName: http
    - name: my-mon-game
      namespace: default
      sectionName: https
  hostnames:
    - mymon-game.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: keycloak
          port: 8080
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: my-mon-game
spec:
  parentRefs:
    - name: my-mon-game
      namespace: default
      sectionName: http
  hostnames:
    - mymon-game.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
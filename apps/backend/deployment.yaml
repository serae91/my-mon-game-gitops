apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: my-mon-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: my-mon-game-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: FRONTEND_URL
              value: https://mymon-game.test
            - name: KEYCLOAK_ISSUER
              value: https://mymon-game.test/auth/realms/mymon-game
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak.my-mon-game.svc.cluster.local:8080/auth/realms/mymon-game/protocol/openid-connect/certs
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

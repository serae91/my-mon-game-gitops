apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-migrate
  namespace: my-mon-game
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:11
          args:
            - migrate
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://postgresql:5432/mymon_game
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: flyway-migrations
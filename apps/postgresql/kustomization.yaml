apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-mon-game

resources:
  - pvc.yaml
  - postgresql-secret.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: postgresql-init
    files:
      - init-keycloak.sh
    options:
      disableNameSuffixHash: true